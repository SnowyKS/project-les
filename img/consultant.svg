<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600">
  <defs>
    <linearGradient id="bgc" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1A3312"/><stop offset="100%" stop-color="#0D1F0A"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#C8A882"/><stop offset="100%" stop-color="#B8946E"/></linearGradient>
  </defs>
  <rect width="500" height="600" fill="url(#bgc)"/>
  <!-- Body -->
  <rect x="150" y="340" width="200" height="260" fill="#2D4A35" rx="20"/>
  <!-- Neck -->
  <rect x="225" y="290" width="50" height="60" fill="url(#skin)"/>
  <!-- Head -->
  <ellipse cx="250" cy="260" rx="75" ry="85" fill="url(#skin)"/>
  <!-- Hair -->
  <ellipse cx="250" cy="185" rx="75" ry="40" fill="#3D2314"/>
  <rect x="175" y="185" width="150" height="30" fill="#3D2314"/>
  <!-- Eyes -->
  <ellipse cx="225" cy="255" rx="10" ry="8" fill="white"/>
  <ellipse cx="275" cy="255" rx="10" ry="8" fill="white"/>
  <ellipse cx="227" cy="256" rx="6" ry="6" fill="#2D1B0E"/>
  <ellipse cx="277" cy="256" rx="6" ry="6" fill="#2D1B0E"/>
  <!-- Smile -->
  <path d="M225,290 Q250,310 275,290" stroke="#8B6040" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- Collar/shirt detail -->
  <polygon points="220,340 250,370 280,340" fill="#1E3A28"/>
  <!-- Arms suggestion -->
  <rect x="100" y="360" width="55" height="160" fill="#2D4A35" rx="20"/>
  <rect x="345" y="360" width="55" height="160" fill="#2D4A35" rx="20"/>
</svg>
